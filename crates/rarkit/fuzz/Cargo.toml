[package]
name = "rarkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `test-support` for `probe::set_offload_floor`: every vector in this
# repository is below the engine's measured offload floor, so a target
# that did not lower it would drive the concurrent driver's inline path
# and never its workers.
rarkit = { path = "..", features = ["bench-internals", "test-support"] }
# The seeded input makers shared with the tests.
rarkit-testdata = { path = "../../rarkit-testdata" }

# Not a member of the rarkit workspace: built by `cargo fuzz` on nightly.
[workspace]
members = ["."]

[[bin]]
name = "rar3_filter_record"
path = "fuzz_targets/rar3_filter_record.rs"
test = false
doc = false
bench = false

