[package]
name = "rarkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace: built by `cargo +nightly fuzz`, never by `make ci`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# `test-support` is what `read_seam` reads `probe::peak_seam` through:
# the seam's source unit is another thread by construction, so whether a
# member was overlapped at all is invisible from the caller's side and
# the counter is the only thing that can see it. It exposes nothing to a
# production caller and changes no output byte.
#
# `audio-lane-ref` is what `rar20_audio_lane` reads the wide reference
# and spec D 1.4.2's bound through. It is a feature of its own and not
# part of either of the other two, because both of those reach
# the gate bench through the crate's dev dependency on itself.
rarkit = { path = "../crates/rarkit", features = [
    "bench-internals",
    "test-support",
    "audio-lane-ref",
] }
# `rar5_solid_chain` names its own lane width by building the global pool,
# which the decode-ahead stage then reads. It must be the SAME rayon the
# engine holds - a second copy has a second global pool and naming that
# one would move nothing - so the version is pinned to the one
# `crates/rarkit/Cargo.toml` asks for.
# The seeded input makers shared with the tests.
rarkit-testdata = { path = "../crates/rarkit-testdata" }
rayon = "1.12.0"
# The `rar5_oracle_*` targets hold rarkit to the OLD ENGINE, called as a
# compiled library and never opened: the
# same adapter every differential test in `crates/rarkit/tests` calls.
# The bench driver vendors its git dependency into the bundle, so a
# remote box builds it offline with no credential.
# Optional, behind `oracle-compare` (below), which is ON by default here so
# every campaign runs as it did. The public tree has no such crate: there
# every line from a `BEGIN oracle-compare` mark to its `END` mark is
# dropped (three marked regions: this line, the feature, the three
# targets), and the three target sources and `oracle_support.rs` with them.


[[bin]]
name = "rar5_encryption_record"
path = "fuzz_targets/rar5_encryption_record.rs"
test = false
doc = false
bench = false

